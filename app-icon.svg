<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81" />
      <stop offset="40%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Accent Gradient 1: Cyan to Indigo -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Accent Gradient 2: Bright Amber/Rose for Flash/Lens -->
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="60%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="50%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#FDA4AF" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#6366F1" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base Icon Squircle / Background -->
  <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="url(#bgGrad)" filter="url(#shadow)" />
  <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="none" stroke="url(#borderGrad)" stroke-width="8" />

  <!-- Studio Grid / Viewfinder Reticle (Subtle) -->
  <g opacity="0.15" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="16 12">
    <line x1="256" y1="200" x2="256" y2="824" />
    <line x1="768" y1="200" x2="768" y2="824" />
    <line x1="200" y1="360" x2="824" y2="360" />
    <line x1="200" y1="664" x2="824" y2="664" />
  </g>

  <!-- Viewfinder Crop / Focus Frame Corners -->
  <g stroke="url(#primaryGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)">
    <!-- Top-Left Corner -->
    <path d="M 220 300 L 220 220 L 300 220" />
    <!-- Top-Right Corner -->
    <path d="M 724 220 L 804 220 L 804 300" />
    <!-- Bottom-Left Corner -->
    <path d="M 220 724 L 220 804 L 300 804" />
    <!-- Bottom-Right Corner -->
    <path d="M 724 804 L 804 804 L 804 724" />
  </g>

  <!-- Main Camera Body / Studio Packshot Object -->
  <g filter="url(#shadow)">
    <!-- Camera Base Body -->
    <rect x="252" y="340" width="520" height="380" rx="64" ry="64" fill="#1E293B" stroke="#334155" stroke-width="6" />

    <!-- Top Viewfinder / Flash Notch -->
    <path d="M 412 340 L 442 270 Q 452 250 472 250 L 552 250 Q 572 250 582 270 L 612 340 Z" fill="#0F172A" stroke="#334155" stroke-width="6" />
    
    <!-- Flash Indicator / Studio Light Indicator -->
    <circle cx="460" cy="300" r="14" fill="#F43F5E" />
    <rect x="520" y="292" width="54" height="16" rx="8" fill="#38BDF8" opacity="0.8" />

    <!-- Outer Lens Ring -->
    <circle cx="512" cy="530" r="150" fill="#0F172A" stroke="url(#primaryGrad)" stroke-width="14" />
    <circle cx="512" cy="530" r="126" fill="#1E1B4B" stroke="#475569" stroke-width="4" />

    <!-- Inner Lens Aperture / Glow -->
    <circle cx="512" cy="530" r="100" fill="url(#lensGrad)" />
    
    <!-- Lens Reflection & Highlight -->
    <ellipse cx="480" cy="495" rx="42" ry="24" transform="rotate(-30 480 495)" fill="#FFFFFF" opacity="0.45" />
    <circle cx="545" cy="565" r="12" fill="#FFFFFF" opacity="0.3" />

    <!-- Resizing / Aspect Ratio Dimension Indicator Icons (Arrows/Badges) -->
    <g transform="translate(640, 360)">
      <circle cx="36" cy="36" r="36" fill="url(#primaryGrad)" filter="url(#glow)" />
      <!-- Resize / Aspect Ratio icon (diagonal double arrow) -->
      <path d="M 24 24 L 48 48 M 48 48 L 36 48 M 48 48 L 48 36 M 24 24 L 36 24 M 24 24 L 24 36" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>
  </g>
</svg>
